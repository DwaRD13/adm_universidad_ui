name: adm_universidad_ui
description: "UniConnect: gestión académica universitaria."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado y navegación
  provider: ^6.1.2
  go_router: ^14.6.2

  # Comunicación con la API y sesión
  http: ^1.6.0
  shared_preferences: ^2.3.3

  # Presentación
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Entrega de tareas y apertura de materiales
  file_picker: ^8.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
